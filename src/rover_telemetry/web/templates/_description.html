  <p><strong>Телеметрія ровера.</strong> Це дашборд ровера — невеликої машини на колесах, яку керують з пульта. Виїзд — один запуск ровера: від увімкнення моторів до зупинки. Утримання — коли ровер зупиняється перед перешкодою, доки вона не зникне. Ровер не знає часу, тому ми показуємо, коли звіт отримано.</p>
